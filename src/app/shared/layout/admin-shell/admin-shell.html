<div class="flex h-screen bg-background overflow-hidden relative">
  <app-dashboard-sidebar
    [isOpen]="isSidebarOpen"
    [isCollapsed]="isSidebarCollapsed"
    (close)="isSidebarOpen = false"
    (toggleCollapse)="isSidebarCollapsed = !isSidebarCollapsed"
  ></app-dashboard-sidebar>

  <main
    [ngClass]="{ 'lg:ml-0': true }"
    class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto bg-background transition-all duration-300"
    (click)="isSidebarOpen = false"
  >
    <router-outlet />
  </main>
</div>
