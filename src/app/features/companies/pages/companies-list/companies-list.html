<div class="dashboard-wrapper">
    <app-dashboard-header></app-dashboard-header>

    <main class="main-content">
        <div class="flex flex-col gap-6 pb-12 animate-fade-in-up">
            <!-- Header -->
            <app-company-header (addCompany)="openCompanyModal()"></app-company-header>

            <!-- Filters -->
            <app-company-filters 
                [searchQuery]="searchQuery"
                [sortBy]="sortBy"
                [pageSize]="pageSize"
                (search)="onSearch($event)"
                (sortChange)="onSortChange($event)"
                (pageSizeChange)="onPageSizeChange($event)"
                (refresh)="onRefresh()">
            </app-company-filters>

            <!-- Table -->
            <app-company-table
                (edit)="openCompanyModal($event)"
                (delete)="onDeleteCompany($event)">
            </app-company-table>
        </div>
    </main>

    <!-- Modal Form -->
    <app-company-form 
        *ngIf="isModalOpen" 
        [companyToEdit]="selectedCompany"
        (closeForm)="closeCompanyModal()"
        (companyRegistered)="onCompanySaved()"
    ></app-company-form>
</div>
