<div class="dashboard-wrapper">
    <app-dashboard-header></app-dashboard-header>

    <main class="main-content">
        <div class="flex flex-col gap-6 pb-12 animate-fade-in-up">
            <!-- Header -->
            <app-company-header (addCompany)="openCompanyModal()"></app-company-header>

            <!-- Filters -->
            <app-company-filters 
                [pageSize]="pageSize"
                (filtersChanged)="onFiltersChanged($event)"
                (pageSizeChange)="onPageSizeChange($event)"
                (refresh)="onRefresh()">
            </app-company-filters>

            <!-- Table -->
            <app-company-table
                #companyTable
                [pageSize]="pageSize"
                (edit)="openCompanyModal($event)"
                (delete)="onDeleteCompany($event)">
            </app-company-table>
        </div>
    </main>

    <!-- Modal Form -->
    <app-company-form 
        *ngIf="isModalOpen" 
        [companyToEdit]="selectedCompany"
        (closeForm)="closeCompanyModal()"
        (companyRegistered)="onCompanySaved()"
    ></app-company-form>

    <!-- Confirm Soft Delete Modal -->
    <div *ngIf="companyToDelete" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
        <div class="bg-card w-full max-w-md p-6 rounded-2xl shadow-xl border border-border shrink-0 m-4">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 rounded-full bg-destructive/10 flex items-center justify-center shrink-0">
                    <svg class="w-6 h-6 text-destructive" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-foreground">Eliminar Empresa</h3>
                    <p class="text-sm text-muted-foreground mt-1">¿Estás seguro de que deseas eliminar la empresa <span class="font-semibold text-foreground">{{ companyToDelete.legalName }}</span>? Esta acción la marcará como inactiva.</p>
                </div>
            </div>
            
            <div class="flex items-center justify-end gap-3 mt-6">
                <button type="button" class="px-4 py-2 text-sm font-semibold text-foreground hover:bg-accent rounded-lg transition-colors" (click)="cancelDelete()">Cancelar</button>
                <button type="button" class="px-4 py-2 text-sm font-semibold bg-destructive hover:bg-destructive/90 text-white rounded-lg transition-colors flex items-center gap-2" [disabled]="isDeleting" (click)="confirmDelete()">
                    <span *ngIf="isDeleting" class="inline-block w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
                    Confirmar Eliminación
                </button>
            </div>
        </div>
    </div>
</div>
