<div class="dashboard-wrapper">
    <app-dashboard-header></app-dashboard-header>

    <main class="main-content">
        <div class="flex flex-col gap-6 pb-12 animate-fade-in-up">
            <!-- Header -->
            <app-user-header (addUser)="openUserModal()"></app-user-header>

            <!-- Filters -->
            <app-user-filters 
                [searchQuery]="searchQuery"
                [sortBy]="sortBy"
                [pageSize]="pageSize"
                (search)="onSearch($event)"
                (sortChange)="onSortChange($event)"
                (pageSizeChange)="onPageSizeChange($event)"
                (refresh)="onRefresh()">
            </app-user-filters>

            <!-- Table -->
            <app-users-table
                (edit)="openUserModal($event)"
                (delete)="onDeleteUser($event)">
            </app-users-table>
        </div>
    </main>

    <!-- Modal Form -->
    <app-user-form 
        *ngIf="isModalOpen" 
        [userToEdit]="selectedUser"
        (closeForm)="closeUserModal()"
        (userSaved)="onUserSaved()"
    ></app-user-form>
</div>
