<div class="dashboard-wrapper">
  <app-dashboard-header></app-dashboard-header>

  <main class="main-content" style="animation: fadeIn 0.3s ease-out">

    <!-- Welcome Header -->
    <div class="welcome-section">
      <div class="welcome-text">
        <h1 class="welcome-title">{{ greeting }}{{ userName ? ', ' + userName : '' }}</h1>
        <p class="welcome-subtitle">Portal de Gestión Ambiental — GAMS Sacaba</p>
      </div>
      <div class="welcome-actions">
        <button class="btn-secondary flex items-center gap-2" routerLink="/inbox">
          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            viewBox="0 0 512 512" 
            class="w-4 h-4"
            fill="currentColor"
          >
            <path d="M91.8 32C59.9 32 32.9 55.4 28.4 86.9L.6 281.2c-.4 3-.6 6-.6 9.1L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-125.7c0-3-.2-6.1-.6-9.1L483.6 86.9C479.1 55.4 452.1 32 420.2 32L91.8 32zm0 64l328.5 0 27.4 192-59.9 0c-12.1 0-23.2 6.8-28.6 17.7l-14.3 28.6c-5.4 10.8-16.5 17.7-28.6 17.7l-120.4 0c-12.1 0-23.2-6.8-28.6-17.7l-14.3-28.6c-5.4-10.8-16.5-17.7-28.6-17.7L64.3 288 91.8 96z"/>
          </svg>
          Ver Bandeja
        </button>
        <button class="btn-secondary" routerLink="/companies">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
          </svg>
          Empresas
        </button>
      </div>
    </div>

    <!-- Role-based Dashboard -->
    @if (isAdmin) {
      <app-admin-dashboard />
    } @else if (isSecretaria) {
      <app-secretaria-dashboard />
    } @else if (isInspector) {
      <app-inspector-dashboard />
    } @else {
      <app-admin-dashboard />
    }

  </main>
</div>
