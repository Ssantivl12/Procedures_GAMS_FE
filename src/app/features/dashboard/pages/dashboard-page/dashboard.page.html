<div class="dashboard-wrapper">
  <app-dashboard-header></app-dashboard-header>

  <main class="main-content" style="animation: fadeIn 0.3s ease-out">

    <!-- Welcome Header -->
    <div class="welcome-section">
      <div class="welcome-text">
        <h1 class="welcome-title">{{ greeting }}{{ userName ? ', ' + userName : '' }}</h1>
        <p class="welcome-subtitle">Portal de Gestión Ambiental — GAMS Sacaba</p>
      </div>
      <div class="welcome-actions">
        <button class="btn-secondary" routerLink="/inbox">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859" />
          </svg>
          Ver Bandeja
        </button>
        <button class="btn-secondary" routerLink="/companies">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
          </svg>
          Empresas
        </button>
      </div>
    </div>

    <!-- Role-based Dashboard -->
    @if (isAdmin) {
      <app-admin-dashboard />
    } @else if (isSecretaria) {
      <app-secretaria-dashboard />
    } @else if (isInspector) {
      <app-inspector-dashboard />
    } @else {
      <app-admin-dashboard />
    }

  </main>
</div>
