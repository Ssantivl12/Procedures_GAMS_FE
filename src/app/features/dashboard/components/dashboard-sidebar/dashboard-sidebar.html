<aside
  [ngClass]="{ 'w-64': !isCollapsed, 'w-20': isCollapsed, 'translate-x-0': isOpen, '-translate-x-full lg:translate-x-0': !isOpen }"
  class="fixed inset-y-0 left-0 z-50 lg:relative h-screen bg-sidebar text-sidebar-foreground flex flex-col transition-all duration-300 shadow-xl lg:shadow-none flex-shrink-0"
>
  <!-- Logo Area -->
  <div class="h-16 flex items-center justify-between px-4 border-b border-sidebar-border shrink-0">
    <div
      *ngIf="!isCollapsed"
      class="flex-shrink-0 flex items-center overflow-hidden whitespace-nowrap animate-fade-in truncate"
    >
      <div class="w-8 h-8 min-w-8 bg-primary/20 rounded-lg flex items-center justify-center overflow-hidden">
        <img src="assets/img/LogoGams.png" alt="GAMS Logo" class="w-6 h-6 object-contain" />
      </div>
      <span class="ml-3 font-bold text-lg tracking-tight text-sidebar-foreground truncate">GAMS Ambiental</span>
    </div>

    <div *ngIf="isCollapsed" class="w-full flex justify-center items-center">
      <div class="w-10 h-10 bg-primary/20 rounded-lg flex items-center justify-center overflow-hidden">
        <img src="assets/img/LogoGams.png" alt="GAMS Logo" class="w-7 h-7 object-contain" />
      </div>
    </div>
  </div>

  <!-- Toggle Button (Horus Desktop Style) -->
  <button
    (click)="onToggleCollapse()"
    class="hidden lg:flex absolute -right-3 top-20 bg-primary hover:bg-primary/90 text-primary-foreground p-1 rounded-full shadow-lg transform transition-transform z-10 focus:outline-none"
    [ngClass]="{ 'rotate-180': isCollapsed }"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
  </button>

  <!-- Mobile Close Backdrop Toggle is handled in AdminShell, but we can add a mobile close button if needed -->

  <!-- Navigation Links -->
  <div class="flex-1 overflow-y-auto overflow-x-hidden py-4 px-3 flex flex-col gap-1 custom-scrollbar">
    @for (link of links; track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="bg-primary text-primary-foreground shadow-md"
        [routerLinkActiveOptions]="{ exact: link.route === '/dashboard' }"
        [title]="isCollapsed ? link.label : ''"
        (click)="onNavigate()"
        class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium text-sidebar-foreground/70 hover:bg-sidebar-accent hover:text-sidebar-foreground transition-all duration-200 group relative"
      >
        <div class="w-5 h-5 shrink-0 flex items-center justify-center" [ngClass]="{ 'mx-auto': isCollapsed, 'mr-3': !isCollapsed }">
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path [attr.d]="link.icon"></path>
          </svg>
        </div>

        <span
          *ngIf="!isCollapsed"
          class="font-medium whitespace-nowrap animate-fade-in truncate flex-1"
        >
          {{ link.label }}
        </span>

        @if (link.badgeCount && !isCollapsed) {
          <span class="ml-auto bg-primary-foreground text-primary text-[10px] font-bold px-1.5 py-0.5 rounded-full">
            {{ link.badgeCount }}
          </span>
        }
      </a>
    }
  </div>

  <!-- Logout Footer -->
  <div class="p-4 border-t border-sidebar-border mt-auto">
    <a
      (click)="onLogout()"
      [title]="isCollapsed ? 'Cerrar Sesión' : ''"
      class="flex items-center px-3 py-2.5 rounded-lg text-sm font-medium text-destructive/90 hover:bg-destructive/10 hover:text-destructive transition-all duration-200 group relative cursor-pointer"
    >
      <div class="w-5 h-5 shrink-0 flex items-center justify-center" [ngClass]="{ 'mx-auto': isCollapsed, 'mr-3': !isCollapsed }">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </div>
      <span *ngIf="!isCollapsed" class="font-medium whitespace-nowrap animate-fade-in">Cerrar Sesión</span>
    </a>
  </div>
</aside>

<!-- Mobile Backdrop -->
<div
  *ngIf="isOpen"
  (click)="close.emit()"
  class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden transition-opacity"
></div>
