<div class="sidebar-shell" [class.is-open]="isOpen">
  <div class="sidebar-backdrop" (click)="close.emit()"></div>

  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <img src="assets/img/LogoGams.png" alt="" class="brand-logo" />
        </div>
        <div class="brand-text">
          <div class="brand-title">GAMS Ambiental</div>
        </div>
      </div>
    </div>

    <nav class="nav">
      @for (link of links; track link.route) {
        <a
          class="nav-item"
          [routerLink]="link.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.route === '/dashboard' }"
          (click)="onNavigate()"
        >
          <span class="nav-icon" aria-hidden="true">
            @switch (link.icon) {
              @case ('home') {
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75V19.875c0 .621.504 1.125 1.125 1.125H9.75V15a.75.75 0 01.75-.75h3a.75.75 0 01.75.75v6h4.125c.621 0 1.125-.504 1.125-1.125V9.75" />
                </svg>
              }
              @case ('users') {
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                </svg>
              }
              @case ('building') {
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
                </svg>
              }
              @case ('inbox') {
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 00-2.15-1.588H6.911a2.25 2.25 0 00-2.15 1.588L2.35 13.177a2.25 2.25 0 00-.1.661z" />
                </svg>
              }
              @case ('status') {
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 14l3-3 4 4 7-7" />
                </svg>
              }
            }
          </span>
          <span class="nav-label">{{ link.label }}</span>
          @if (link.badgeCount) {
            <span class="nav-badge" aria-label="Pendientes">{{ link.badgeCount }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button class="logout" type="button" (click)="onLogout()">
        <span class="logout-icon" aria-hidden="true">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-7.5A2.25 2.25 0 003.75 5.25v13.5A2.25 2.25 0 006 21h7.5a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
        </span>
        Cerrar sesión
      </button>
    </div>
  </aside>
</div>
