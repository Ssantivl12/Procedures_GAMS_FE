<div class="bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="flex items-center justify-between px-6 py-4 border-b border-border">
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5 text-muted-foreground" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" fill="currentColor">
        <path d="M176 48L64 48c-8.8 0-16 7.2-16 16l0 384c0 8.8 7.2 16 16 16l256 0c8.8 0 16-7.2 16-16l0-240-88 0c-39.8 0-72-32.2-72-72l0-88zM316.1 160L224 67.9 224 136c0 13.3 10.7 24 24 24l68.1 0zM0 64C0 28.7 28.7 0 64 0L197.5 0c17 0 33.3 6.7 45.3 18.7L365.3 141.3c12 12 18.7 28.3 18.7 45.3L384 448c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 64z"/>
      </svg>

      <h3 class="text-sm font-semibold text-foreground">Documentos</h3>
      <span class="text-xs text-muted-foreground">({{ documents.length || 0 }})</span>
    </div>
    <button class="cursor-pointer inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-primary bg-primary/10 rounded-lg hover:bg-primary/20 transition-colors"
            (click)="showUploadForm = true">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
      </svg>
      Subir
    </button>
  </div>

  @if (isLoading) {
    <div class="flex items-center justify-center py-8">
      <svg class="animate-spin w-5 h-5 text-primary" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </div>
  } @else if (!documents || documents.length === 0) {
    <div class="px-6 py-8 text-center">
      <p class="text-sm text-muted-foreground">No hay documentos adjuntos.</p>
    </div>
  } @else {
    <div class="px-3 divide-y divide-border/50">
      @for (doc of documents; track doc.id) {
        <app-document-item
          [doc]="doc"
          (download)="onDownload($event)"
          (deleteDoc)="onDelete($event)">
        </app-document-item>
      }
    </div>
  }
</div>

@if (showUploadForm) {
  <app-document-upload
    [procedureId]="procedureId"
    [cycleId]="activeCycleId"
    (closeForm)="showUploadForm = false"
    (uploaded)="onUploaded()">
  </app-document-upload>
}
