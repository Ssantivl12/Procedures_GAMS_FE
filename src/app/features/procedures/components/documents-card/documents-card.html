<div class="bg-card rounded-xl border border-border shadow-sm overflow-hidden">
  <div class="flex items-center justify-between px-6 py-4 border-b border-border">
    <div class="flex items-center gap-2">
      <svg class="w-5 h-5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9.75m0 0l3-3m-3 3l3 3M5.625 3.375h4.5c.621 0 1.125.504 1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125h1.5c.621 0 1.125.504 1.125 1.125v10.125c0 .621-.504 1.125-1.125 1.125H5.625a1.125 1.125 0 01-1.125-1.125V4.5c0-.621.504-1.125 1.125-1.125z" />
      </svg>
      <h3 class="text-sm font-semibold text-foreground">Documentos</h3>
      <span class="text-xs text-muted-foreground">({{ documents.length }})</span>
    </div>
    <button class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-primary bg-primary/10 rounded-lg hover:bg-primary/20 transition-colors"
            (click)="showUploadForm = true">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
      </svg>
      Subir
    </button>
  </div>

  @if (isLoading) {
    <div class="flex items-center justify-center py-8">
      <svg class="animate-spin w-5 h-5 text-primary" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </div>
  } @else if (documents.length === 0) {
    <div class="px-6 py-8 text-center">
      <p class="text-sm text-muted-foreground">No hay documentos adjuntos.</p>
    </div>
  } @else {
    <div class="px-3 divide-y divide-border/50">
      @for (doc of documents; track doc.id) {
        <app-document-item
          [doc]="doc"
          (download)="onDownload($event)"
          (deleteDoc)="onDelete($event)">
        </app-document-item>
      }
    </div>
  }
</div>

@if (showUploadForm) {
  <app-document-upload
    [procedureId]="procedureId"
    (closeForm)="showUploadForm = false"
    (uploaded)="onUploaded()">
  </app-document-upload>
}
