<div class="modal-overlay" (click)="closeForm.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between p-6 border-b border-border">
      <h2 class="text-lg font-semibold text-foreground">Nueva Observación</h2>
      <button class="p-1.5 rounded-lg hover:bg-muted transition-colors" (click)="closeForm.emit()">
        <svg class="w-5 h-5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">

      <div>
        <label class="block text-sm font-medium text-foreground mb-1.5">Resumen *</label>
        <input formControlName="summary" type="text" placeholder="Descripción breve de la observación"
               class="w-full px-3 py-2 text-sm rounded-xl border border-border bg-card focus:outline-none focus:ring-2 focus:ring-primary/30"
               [class.border-red-400]="submitted && f['summary'].invalid" />
        @if (submitted && f['summary'].hasError('required')) {
          <span class="text-xs text-red-500 mt-1 block">El resumen de la observación es requerido.</span>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-foreground mb-1.5">Detalles</label>
        <textarea formControlName="details" rows="3" placeholder="Detalles adicionales..."
                  class="w-full px-3 py-2 text-sm rounded-xl border border-border bg-card focus:outline-none focus:ring-2 focus:ring-primary/30 resize-none"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-foreground mb-1.5">Categoría *</label>
          <select formControlName="category"
                  class="w-full px-3 py-2 text-sm rounded-xl border border-border bg-card focus:outline-none focus:ring-2 focus:ring-primary/30">
            @for (cat of categories; track cat) {
              <option [value]="cat">{{ categoryLabels[cat] }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-foreground mb-1.5">Prioridad *</label>
          <select formControlName="priority"
                  class="w-full px-3 py-2 text-sm rounded-xl border border-border bg-card focus:outline-none focus:ring-2 focus:ring-primary/30">
            @for (pri of priorities; track pri) {
              <option [value]="pri">{{ priorityLabels[pri] }}</option>
            }
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-border">
        <button type="button" (click)="closeForm.emit()"
                class="cursor-pointer px-4 py-2 text-sm font-medium rounded-xl border border-border text-foreground hover:bg-muted transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="isLoading"
                class="cursor-pointer px-4 py-2 text-sm font-medium rounded-xl bg-orange-600 text-white hover:bg-orange-700 transition-colors disabled:opacity-50">
          @if (isLoading) {
            <svg class="animate-spin w-4 h-4 mr-1.5 inline-block" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          }
          Crear Observación
        </button>
      </div>
    </form>
  </div>
</div>
