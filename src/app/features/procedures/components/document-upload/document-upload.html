<div class="modal-overlay" (click)="closeForm.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between p-6 border-b border-border">
      <h2 class="text-lg font-semibold text-foreground">Subir Documento</h2>
      <button class="p-1.5 rounded-lg hover:bg-muted transition-colors" (click)="closeForm.emit()">
        <svg class="w-5 h-5 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-foreground mb-1.5">Archivo PDF *</label>
        <div class="border-2 border-dashed border-border rounded-xl p-6 text-center hover:border-primary/50 transition-colors cursor-pointer"
             (click)="fileInput.click()">
          <input #fileInput type="file" accept=".pdf" class="hidden" (change)="onFileSelected($event)" />
          @if (selectedFile) {
            <div class="flex items-center justify-center gap-2">
              <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
              </svg>
              <span class="text-sm font-medium text-foreground">{{ selectedFile.name }}</span>
            </div>
          } @else {
            <svg class="w-8 h-8 text-muted-foreground mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            <p class="text-sm text-muted-foreground">Haz clic para seleccionar un PDF</p>
            <p class="text-xs text-muted-foreground mt-1">Máximo 20 MB</p>
          }
        </div>
      </div>

      @if (error) {
        <div class="text-sm text-red-600 bg-red-50 p-2 rounded-lg">{{ error }}</div>
      }

      <div>
        <label class="block text-sm font-medium text-foreground mb-1.5">Grupo de Documento *</label>
        <select formControlName="docGroup"
                class="w-full px-3 py-2 text-sm rounded-xl border border-border bg-card focus:outline-none focus:ring-2 focus:ring-primary/30">
          @for (group of docGroups; track group) {
            <option [value]="group">{{ docGroupLabels[group] }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-foreground mb-1.5">Descripción</label>
        <input formControlName="description" type="text" placeholder="Descripción opcional"
               class="w-full px-3 py-2 text-sm rounded-xl border border-border bg-card focus:outline-none focus:ring-2 focus:ring-primary/30" />
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-border">
        <button type="button" (click)="closeForm.emit()"
                class="px-4 py-2 text-sm font-medium rounded-xl border border-border text-foreground hover:bg-muted transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="isLoading"
                class="px-4 py-2 text-sm font-medium rounded-xl bg-primary text-primary-foreground hover:bg-primary/90 transition-colors disabled:opacity-50">
          @if (isLoading) {
            <svg class="animate-spin w-4 h-4 mr-1.5 inline-block" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          }
          Subir Documento
        </button>
      </div>
    </form>
  </div>
</div>
